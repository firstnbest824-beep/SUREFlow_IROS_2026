# Vanilla, no-method baseline. `method: none` resolves to
# `methods.base.NoOverrideMethod`, which always defers to the base OpenVLA
# policy -- see tools/action_generalization/methods/base.py.
#
# task_id / init_state_id / seed / checkpoint below match the existing
# gate5_smoke reference episode collected by the diagnostics-line pipeline
# (tools/openvla/collect_official_activations.py), so a Phase 4 rollout run
# through this config is directly comparable to:
#   /home/HDD/hwkim/openvla_activations/gate5_smoke/libero_spatial/vanilla/
#     task_00/seed_000/episode_000/manifest.json
# (task_id 0, init_state_id 0, seed 0, condition vanilla, success=true,
# 81 timesteps).

method: none

suite: libero_spatial
task_id: 0
init_state_id: 0
seed: 0
condition: vanilla

checkpoint:
  model_id: openvla/openvla-7b-finetuned-libero-spatial
  revision: 962318cec55ac10993ff0f5f43eda9a270b4c873
  unnorm_key: libero_spatial

resolution: 256
resize_size: 224
center_crop: true
num_steps_wait: 10
max_steps: 220

attn_implementation: eager
dtype: bfloat16
gpu: 0
