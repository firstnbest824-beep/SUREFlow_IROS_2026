# Task-scoped oracle proof of concept: LIBERO-PRO position perturbation.
# The target name is intentionally explicit; this is not an instruction parser.
method: global_approach

suite: libero_object
task_id: 0
init_state_id: 0
seed: 0
condition: y0.1

checkpoint:
  model_id: openvla/openvla-7b-finetuned-libero-object
  revision: 287d6cfdf12d07b1449505f66d9bf3550257e9b3
  unnorm_key: libero_object

resolution: 256
resize_size: 224
center_crop: true
num_steps_wait: 10
max_steps: 220
attn_implementation: eager
dtype: bfloat16
gpu: 1

global_approach:
  oracle_target: true
  # The object center is at z=0.015 m at the selected runtime state.  A 12 cm
  # vertical clearance avoids driving into the object before OpenVLA's grasp.
  target_object: alphabet_soup_1
  approach_offset_xyz: [0.0, 0.0, 0.12]
  switch_distance: 0.05
  controller_type: osc_pose_delta
  # OSC maps normalized translation +/-1 to +/-0.05 m; the 0.5 cap therefore
  # bounds each geometric policy step to a 2.5 cm desired Cartesian delta.
  kp: 4.0
  max_translation_command: 0.5
  one_way_switch: true

checkpoint_policy:
  retain: [best, last]
  save_every_step: false
